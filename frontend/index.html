<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUANTHUNT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="/config.js?v=20260505a"></script>
    <script>
    window.onerror = function(message, source, lineno, colno, error) {
      document.body.innerHTML = '<div style="color:red;font-size:20px;padding:20px;z-index:9999;position:absolute;background:white;">Error: ' + message + ' at ' + lineno + ':' + colno + '<br>' + (error && error.stack) + '</div>';
    };
    window.addEventListener('unhandledrejection', function(event) {
      document.body.innerHTML = '<div style="color:red;font-size:20px;padding:20px;z-index:9999;position:absolute;background:white;">Promise Error: ' + event.reason + '</div>';
    });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>
  </body>
</html>
